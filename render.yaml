services:
  - type: web
    name: quangiahuongnoi-discord-admin
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DEFAULT_MEMBER_ROLE_ID
        sync: false

      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

      - key: SOCIAL_MONITOR_ENABLED
        value: "true"
      - key: SOCIAL_MONITOR_INTERVAL_MS
        value: "60000"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      - key: SOCIAL_FALLBACK_CHANNEL_ID
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: quangiahuongnoi-discord-db
          property: connectionString


databases:
  - name: quangiahuongnoi-discord-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
